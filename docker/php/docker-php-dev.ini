; Development-only PHP settings (not used by the production image).
;
; OPcache in the CLI was measured in Phase 7 and did not speed up the test suite (the cost is
; per-test app boot + database work, not file reads), so it is not enabled here.

; Coverage only when asked for (php artisan test --coverage); otherwise no overhead.
pcov.enabled = 1
pcov.directory = /var/www/html/app

memory_limit = 512M
