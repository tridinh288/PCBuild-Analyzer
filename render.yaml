# Render Blueprint (D-024): Dashboard → New → Blueprint → select this repository.
# Values marked `sync: false` are secrets: Render asks for them when the Blueprint is created
# and they are never stored in this repository. See docs/DEPLOYMENT.md.

services:
  # Laravel API — Docker web service
  - type: web
    name: pcbuild-api
    runtime: docker
    plan: free
    region: singapore # close to TiDB ap-southeast-1 and to users in Vietnam
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: PCBuild Analyzer
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_LOCALE
        value: vi
      - key: APP_KEY # output of: php artisan key:generate --show
        sync: false
      - key: APP_URL # https://<api service>.onrender.com
        sync: false
      - key: FRONTEND_URL # https://<static site>.onrender.com — the only CORS origin
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: PHP_CLI_SERVER_WORKERS
        value: "4"

      # TiDB Cloud Starter over TLS (D-021, D-033)
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_DATABASE
        value: pcbuild # never `sys`
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MYSQL_ATTR_SSL_CA
        value: /etc/ssl/certs/ca-certificates.crt

      # Stateless API
      - key: CACHE_STORE
        value: database
      - key: SESSION_DRIVER
        value: array
      - key: QUEUE_CONNECTION
        value: sync

      - key: CLOUDINARY_URL # cloudinary://<key>:<secret>@<cloud>
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SANCTUM_EXPIRATION
        value: "480"
      # Set to "true" for the first deploy only (demo data + admin), then delete it.
      - key: SEED_DATABASE
        value: "false"

  # React app — static site
  - type: web
    name: pcbuild-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_URL # https://<api service>.onrender.com/api — read at build time
        sync: false
    routes:
      # Client-side routing: every path serves the React app.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
