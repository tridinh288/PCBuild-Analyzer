; Production PHP settings for the API container.

expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr

memory_limit = 256M
upload_max_filesize = 4M
post_max_size = 6M

; Code never changes inside a running container: skip file timestamp checks.
opcache.enable = 1
opcache.enable_cli = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
